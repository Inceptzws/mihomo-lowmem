<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
  <style>
    .t  { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .h  { font-size:18px; font-weight:700; fill:#111827; }
    .box{ font-size:13px; font-weight:600; fill:#1f2937; }
    .sub{ font-size:11px; fill:#6b7280; }
    .file{ font-size:11px; font-weight:600; fill:#065f46; }
  </style>
  <rect width="880" height="470" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="879" height="469" rx="14" fill="none" stroke="#e5e7eb"/>
  <text class="t h" x="30" y="38">系统架构 / System architecture</text>

  <!-- 外网 -->
  <rect x="30" y="62" width="120" height="52" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text class="t box" x="46" y="84">WAN</text>
  <text class="t sub" x="46" y="101">DHCP client</text>

  <!-- 路由器外壳 -->
  <rect x="170" y="62" width="680" height="300" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-dasharray="5 4"/>
  <text class="t sub" x="186" y="82">Router · OpenWrt 23.05.5</text>

  <!-- LAN 设备 -->
  <rect x="30" y="180" width="120" height="86" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text class="t box" x="46" y="204">LAN clients</text>
  <text class="t sub" x="46" y="222">WiFi + wired</text>
  <text class="t sub" x="46" y="240">no client config</text>

  <!-- nftables -->
  <rect x="196" y="180" width="150" height="86" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
  <text class="t box" x="210" y="204">nftables</text>
  <text class="t sub" x="210" y="222">br-lan prerouting</text>
  <text class="t sub" x="210" y="240">tcp → :7892</text>
  <text class="t sub" x="210" y="256">dns → :1053</text>

  <!-- mihomo -->
  <rect x="376" y="140" width="200" height="166" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.6"/>
  <text class="t box" x="392" y="166" font-size="14" fill="#4338ca">mihomo (procd)</text>
  <text class="t sub" x="392" y="188">redir   :7892</text>
  <text class="t sub" x="392" y="206">mixed   :7890</text>
  <text class="t sub" x="392" y="224">dns     :1053</text>
  <text class="t sub" x="392" y="242">api     :9990</text>
  <rect x="392" y="256" width="168" height="34" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="t sub" x="400" y="270" font-weight="700" fill="#4f46e5">GOGC=50</text>
  <text class="t sub" x="400" y="284" font-weight="700" fill="#4f46e5">GOMEMLIMIT=20MiB</text>

  <!-- 规则分流 -->
  <rect x="606" y="140" width="222" height="80" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text class="t box" x="620" y="164">rules (1179)</text>
  <text class="t sub" x="620" y="184">DOMAIN-SUFFIX,cn,DIRECT   ← one rule / 一条规则</text>
  <text class="t sub" x="620" y="202">+ curated + catch-all</text>

  <!-- 面板 -->
  <rect x="606" y="234" width="222" height="72" rx="8" fill="#f0f9ff" stroke="#38bdf8"/>
  <text class="t box" x="620" y="258">dashboard :9990/ui/</text>
  <text class="t sub" x="620" y="276">switch node · latency · subscription</text>
  <text class="t sub" x="620" y="293">LuCI :80  (optional app)</text>

  <!-- 存储分工 -->
  <rect x="196" y="300" width="632" height="46" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text class="t file" x="210" y="320">flash (persistent) / 闪存</text>
  <text class="t sub" x="380" y="320">CrashCore.xz 5.91MB · config.yaml · head/tail · nft.rules · ui · init.d</text>
  <text class="t file" x="210" y="338">tmpfs (volatile) / 内存盘</text>
  <text class="t sub" x="380" y="338">CrashCore 28.25MB · working config · ui</text>

  <!-- 流程箭头 -->
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0,0 L7,3.2 L0,6.4 z" fill="#9ca3af"/></marker></defs>
  <line x1="150" y1="88" x2="196" y2="88" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="150" y1="223" x2="192" y2="223" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="346" y1="223" x2="372" y2="223" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="576" y1="180" x2="602" y2="180" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="576" y1="270" x2="602" y2="270" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="476" y1="140" x2="476" y2="104" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="476" y1="104" x2="150" y2="104" stroke="#9ca3af" stroke-width="1.6"/>
  <text class="t sub" x="500" y="100">outbound through proxy pool / 经线路池出网</text>

  <text class="t sub" x="30" y="436">Data path / 数据流：client → nftables → mihomo → rule match → direct or proxy</text>
  <text class="t sub" x="30" y="454">The router never downloads your subscription — the device does. See docs/01-memory-design.md §5</text>
</svg>
